<head>

<title>Vale Verde: decisões em jogo</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--tx:#23301f;--mut:#667060;--ac:#2f6b3a;--ac2:#e9f1e3;--bd:#d8d3c6;--warn:#a4452c;--note:#eef3f8;--notetx:#27425e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161b15;--card:#1f261e;--tx:#e8eee3;--mut:#9aa693;--ac:#7fc78c;--ac2:#27352a;--bd:#34402f;--warn:#e58a6f;--note:#1c2833;--notetx:#a9c8e8}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;line-height:1.55}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 16px;font-family:system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-family:system-ui,sans-serif;font-size:.78rem}
.bar{height:8px;background:var(--ac2);border-radius:99px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--ac);transition:width .5s,background .5s}
.who{font-family:system-ui,sans-serif;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ac);margin-bottom:6px;font-weight:600}
.says{font-size:1.05rem;margin:0 0 12px}
.q{font-weight:700;margin:14px 0 10px}
button{font:inherit;cursor:pointer;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;transition:.15s}
button:hover:not(:disabled){border-color:var(--ac);background:var(--ac2)}
button:disabled{opacity:.55;cursor:default}
button.sel{border-color:var(--ac);background:var(--ac2);opacity:1}
.go{width:auto;background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;padding:10px 20px;font-family:system-ui,sans-serif}
.go:hover:not(:disabled){background:var(--ac);filter:brightness(1.1)}
.note{background:var(--note);color:var(--notetx);border-radius:10px;padding:12px 14px;font-family:system-ui,sans-serif;font-size:.86rem;margin:12px 0}
.log{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mut);padding-left:18px}
.ref{font-family:system-ui,sans-serif;font-size:.78rem;color:var(--mut)}
.tag{display:inline-block;font-family:system-ui,sans-serif;font-size:.72rem;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 10px;margin-bottom:8px}
.hero{text-align:center;padding:28px 20px}.big{font-size:3rem;font-weight:700;color:var(--ac);line-height:1.1;margin:6px 0}.timer{height:6px;background:var(--ac2);border-radius:99px;overflow:hidden;margin-bottom:12px}#tb{height:100%;width:100%;background:var(--warn)}.letter{border-left:4px solid var(--ac);padding:6px 0 6px 14px;margin:14px 0;font-style:italic;font-size:1.05rem}.quote{font-size:1.2rem;font-weight:700;text-align:center;margin:18px 0;color:var(--ac)}label.lb{display:block;font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mut);margin:14px 0}body{transition:background .8s}.cred{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mut);border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:14px;line-height:1.5}.cred strong{display:block;color:var(--tx);font-size:.95rem}.cred strong.ttl{font-size:1.2rem;line-height:1.3;margin-bottom:6px}.lg{background:#fff;border-radius:10px;padding:8px 14px;display:inline-block;margin-bottom:10px}.lg img{height:46px;width:auto;display:block;max-width:100%}.refl{padding-left:20px;margin:8px 0 12px}.refl li{margin-bottom:6px;word-break:break-word}.clock{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mut);text-align:right;margin-bottom:6px}.cd{font-family:system-ui,sans-serif;font-size:1rem;color:var(--mut);margin-bottom:4px;font-weight:600;font-variant-numeric:tabular-nums}.cd.low{color:#e5383b;font-weight:800;font-size:1.25rem;animation:bl 1s infinite}@keyframes bl{50%{opacity:.55}}#tb.low{background:#e5383b}.snd{font:inherit;width:auto;display:inline-block;padding:2px 12px;margin:0 0 8px;font-size:.8rem;border-radius:99px}
</style>

<body>
<main>
<h1>Vale Verde: decisões em jogo</h1>
<p class="sub">Narrativa interativa sobre pecuária, aquecimento global e recursos naturais. Cada escolha muda a história.</p>
<div class="clock" id="clock">⏱️ Tempo de jogo: 0:00</div><div style="text-align:right"><button class="snd" id="snd">🔊 Som: ligado</button></div><div class="card stats" id="stats"></div>
<div id="game"></div>
</main>
<script>
const S={clima:5,eco:5,com:5,log:[],i:0};
const N={
 helena:'Dra. Helena (ambientalista)',
 raimundo:'Seu Raimundo (pecuarista)',
 cida:'Dona Cida (líder comunitária)',
 voce:'Narrador',bia:'Bia (estudante de Sociologia)',marina:'Dra. Marina (climatologista)',vereador:'Vereador Teo (oposição)'
};
const scenes=[
{who:'raimundo',say:'Prefeito(a), a pecuária sustenta 6 em cada 10 empregos aqui no Vale Verde. Mas o inventário de emissões do município acabou de sair e todo mundo está olhando para o meu gado.',
 q:'Como você reage ao inventário de emissões?',
 opts:[
 {t:'Encomendar um estudo independente, com dados de monitoramento em campo.',r:'Helena sorri: “Medir de verdade evita discussão baseada em achismo.” Raimundo resmunga, mas aceita participar.',d:[1,0,1],sci:'A FAO estima que a pecuária responde por cerca de 14,5% das emissões humanas globais, e o gado bovino por aproximadamente 65% dessas. Outras estimativas chegam a 16,5%–28,1%, e há crítica de que modelos podem subestimar o metano sem dados atmosféricos medidos.'},
 {t:'Aceitar o número oficial e seguir a rotina, para não atrapalhar a economia local.',r:'Raimundo respira aliviado. Helena avisa que o assunto vai voltar com mais força.',d:[-1,1,-1],sci:'Estimativas oficiais são úteis, mas a literatura mostra que a incerteza é grande: o número muda conforme o método. Ignorar a incerteza pode adiar decisões importantes.'},
 {t:'Convocar uma audiência pública com produtores, moradores e pesquisadores.',r:'Dona Cida agradece por ser ouvida pela primeira vez. A conversa é longa e tensa, mas ninguém sai excluído.',d:[0,0,2],sci:'Do ponto de vista sociológico, o conflito ambiental envolve atores com interesses e poderes distintos. Processos participativos tendem a dar mais legitimidade às políticas locais.'}
 ]},
{who:'helena',say:'Os satélites mostram que boa parte das pastagens do país está degradada: solo exposto, mato invasor, pouca capacidade de sustentar gado. O pasto do Vale não é diferente.',
 q:'O que fazer com a terra já aberta?',
 opts:[
 {t:'Criar crédito para recuperar pastagens degradadas, com assistência técnica.',r:'Raimundo topa. “Produzir mais no mesmo chão eu entendo.” Helena concorda, com ressalvas sobre custo.',d:[1,1,0],sci:'Estudo de satélite da NASA/UFG apontou cerca de 45% das pastagens brasileiras com sinais de degradação, e o plano ABC buscou reabilitar 15 milhões de hectares. Recuperar pasto pode reduzir a pressão por novo desmatamento.'},
 {t:'Liberar a abertura de novas áreas para ampliar o rebanho.',r:'A economia anima, os caminhões lotam as estradas. Helena deixa a reunião sem dizer nada.',d:[-2,2,-1],sci:'A criação de pastos é um dos principais vetores do desmatamento amazônico. A conversão de floresta em pasto libera carbono e reduz a capacidade de a região regular o clima.'},
 {t:'Proibir qualquer expansão, sem oferecer alternativa.',r:'O clima agradece, o orçamento não. Raimundo promete ir à Justiça e vários vizinhos fecham as portas.',d:[2,-2,-1],sci:'Restrições sem apoio econômico podem gerar conflito social e perda de renda. Pesquisas sobre a lista de municípios prioritários na Amazônia sugerem que a queda do desmatamento pode vir junto com mais produtividade quando há política de apoio.'}
 ]},
{who:'raimundo',say:'Doutor(a), meu gado emite metano, eu sei. Mas o que eu faço com isso? Não vou sacrificar rebanho.',
 q:'Qual caminho você apoia para reduzir o metano e o impacto do rebanho?',
 opts:[
 {t:'Incentivar manejo: melhoria da dieta, genética e abate mais precoce.',r:'Raimundo vê lucro na ideia: animal que engorda mais rápido emite menos por quilo de carne.',d:[1,1,0],sci:'Cerca de 44% das emissões da pecuária são metano, em grande parte da fermentação entérica dos ruminantes. O relatório da FAO estima que boas práticas poderiam cortar emissões do setor em cerca de um terço.'},
 {t:'Criar uma taxa sobre emissões do rebanho.',r:'Helena aplaude. Raimundo diz que vai repassar o custo, e Dona Cida teme o preço da carne.',d:[2,-1,-1],sci:'Instrumentos de preço podem funcionar, mas têm efeito distributivo: se o custo recai sobre consumidores de baixa renda, a política precisa de compensação.'},
 {t:'Lançar uma campanha para a população reduzir o consumo de carne.',r:'A campanha rende debate, memes e pouco efeito prático no curto prazo. Mas abre uma conversa sobre hábitos.',d:[1,-1,0],sci:'Dietas com menos produtos animais reduzem a demanda por pasto e ração, mas mudar hábitos alimentares envolve cultura, renda e identidade, e não só informação.'}
 ]},
{who:'cida',say:'Aqui no assentamento a gente cria poucas cabeças, com pasto ralo. Ninguém vem ensinar nada, e quando vem é para os grandes.',
 q:'E os pequenos produtores? Como incluí-los?',
 opts:[
 {t:'Fortalecer cooperativas e assistência técnica para os pequenos.',r:'Dona Cida traz 40 famílias para a primeira reunião. A produtividade começa a subir devagar.',d:[1,0,2],sci:'A produtividade da pecuária na Amazônia segue baixa, e ganhos dependem de acesso a técnica, crédito e mercado. Sem isso, a intensificação beneficia sobretudo quem já tem capital.'},
 {t:'Deixar o mercado resolver: quem for eficiente fica.',r:'Os grandes absorvem as terras dos pequenos. A produção cresce, a desigualdade também.',d:[0,1,-2],sci:'A concentração fundiária e a saída de pequenos produtores são temas clássicos da sociologia rural. Eficiência econômica e justiça social nem sempre andam juntas.'},
 {t:'Incentivar sistemas integrados de lavoura, pecuária e floresta.',r:'Helena vibra com a ideia. Raimundo pede tempo para aprender e testar em uma área piloto.',d:[1,0,1],sci:'Sistemas integrados combinam produção e conservação e podem elevar a produtividade por hectare, mas exigem investimento inicial e conhecimento técnico.'}
 ]},
{who:'bia',say:'Aqui na universidade, o restaurante universitário serve carne todo dia. O centro acadêmico está dividido: uns querem um cardápio mais vegetal, outros dizem que isso é imposição.',
 q:'Qual decisão você toma para o restaurante universitário?',
 opts:[
 {t:'Manter a carne, mas oferecer uma opção vegetal atraente e porções de carne menores como padrão.',r:'A fila não diminui, mas o prato vegetal esgota cedo. Bia comemora, e Raimundo acha justo.',d:[1,0,1],sci:'Segundo Poore e Nemecek (2018), animais criados para alimento ocupam mais de 80% das terras agrícolas (pasto e lavouras de ração), mas fornecem cerca de 18% das calorias e 37% da proteína. Por outro lado, produtos animais são fontes densas de nutrientes, então o debate envolve nutrição, cultura e renda, e não só clima.'},
 {t:'Não mudar nada: comida é escolha individual.',r:'Ninguém reclama no curto prazo. Mas a pergunta sobre o que a universidade ensina e o que pratica fica no ar.',d:[-1,0,0],sci:'Escolhas alimentares são moldadas por preço, oferta e hábito, e não só por decisão individual. Instituições públicas compram em grande escala e influenciam o que se produz.'},
 {t:'Proibir a carne bovina no restaurante a partir de segunda-feira.',r:'Os protestos são imediatos. Estudantes de baixa renda dizem que aquela era a refeição principal do dia.',d:[1,-1,-2],sci:'Medidas impositivas podem gerar rejeição e atingir mais quem depende de alimentação subsidiada. Mudanças alimentares duradouras costumam depender de participação e de alternativas acessíveis.'}
 ]},
{who:'raimundo',say:'Doutor(a), dizem que meu gado compete com a comida das pessoas. Mas a soja vira óleo e o bagaço que sobra é o que eu compro como ração!',
 q:'Como tratar a ração e a origem da soja?',
 opts:[
 {t:'Exigir transparência sobre a origem da ração, para não comprar de área desmatada.',r:'Raimundo reclama do trabalho extra, mas admite que o comprador internacional vai perguntar a mesma coisa.',d:[1,-1,0],sci:'Parte da ração é subproduto (como o farelo de soja depois da extração do óleo), mas estimativas apontam que cerca de 38% das lavouras do mundo produzem ração. A expansão de pasto e lavouras é um dos motores do desmatamento, por isso a origem importa.'},
 {t:'Comprar a ração mais barata, de onde vier.',r:'O custo cai e a margem sobe. Helena alerta que ninguém sabe de onde vem aquela soja.',d:[-1,1,0],sci:'Cadeias globais de ração ligam o consumo de carne a áreas distantes. Sem rastreio, o impacto fica invisível para quem produz e para quem consome.'},
 {t:'Estimular o uso de resíduos e subprodutos agrícolas locais na alimentação do gado.',r:'A ideia vira projeto com a cooperativa. É menos vistosa, mas reduz custos e a dependência de fora.',d:[1,1,0],sci:'Aproveitar resíduos pode reduzir a competição entre ração e alimento humano, embora a disponibilidade varie e o ganho dependa de cada sistema produtivo.'}
 ]},
{who:'cida',say:'Na feira, tanta comida boa vai para o lixo no fim do dia. E no mercado também. Isso não conta?',
 q:'O que fazer com o desperdício de alimentos?',
 opts:[
 {t:'Criar um programa de redução de perdas e doação, ligando feiras, mercados e banco de alimentos.',r:'Dona Cida organiza os voluntários, e o assentamento passa a receber verduras todo sábado.',d:[1,0,2],sci:'Segundo a síntese de Poore e Nemecek, cerca de um quarto das emissões do sistema alimentar vem de perdas e desperdício. Reduzir o desperdício corta emissões sem exigir mais produção.'},
 {t:'Focar só em produzir mais; o desperdício é problema do consumidor.',r:'A produção cresce, o lixo também. Ninguém se sente responsável.',d:[-1,1,-1],sci:'As perdas ocorrem em toda a cadeia: colheita, armazenamento, transporte, varejo e consumo. Culpar apenas o consumidor ignora a responsabilidade dos outros elos.'},
 {t:'Investir em refrigeração, embalagem e transporte para reduzir perdas antes do mercado.',r:'O investimento é alto, mas as perdas caem. Raimundo percebe que isso também ajuda o leite que ele vende.',d:[1,-1,1],sci:'Embalagens duráveis, refrigeração e processamento adequado ajudam a prevenir perdas, mas exigem investimento e infraestrutura.'}
 ]},
{who:'vereador',say:'Os cientistas nem concordam: uns falam em 14%, outros em 20%, outros em 28%. Se nem eles sabem, por que mudar alguma coisa?',
 q:'Como você responde à dúvida do vereador?',
 opts:[
 {t:'Explicar que a incerteza está no tamanho do problema, não na sua existência, e agir com cautela.',r:'O vereador franze a testa, mas a plateia entende. Helena anota: “Foi o único que explicou direito.”',d:[1,0,1],sci:'As diferenças vêm de métodos, de fronteiras do que se contabiliza e de fontes de dados. A faixa de 16,5% a 28,1% e a crítica à modelagem mostram incerteza sobre a magnitude, e não sobre a contribuição relevante do setor. A sociologia da ciência estuda justamente como números circulam na política.'},
 {t:'Esperar um consenso exato antes de mudar qualquer coisa.',r:'O debate é adiado, e adiado de novo. Passam-se anos.',d:[-1,0,0],sci:'Exigir certeza absoluta pode funcionar como estratégia de adiamento. Em muitas políticas ambientais, age-se com a melhor evidência disponível e se ajusta depois.'},
 {t:'Divulgar apenas o maior número, 28%, para chocar e mobilizar.',r:'A manchete rende, mas o vereador aponta o exagero e a credibilidade da prefeitura despenca.',d:[0,0,-1],sci:'Escolher só o número mais alarmante tende a minar a confiança pública. Comunicar a faixa de incerteza com clareza é mais honesto e ajuda a manter a credibilidade.'}
 ]},
{who:'helena',say:'O Vale ainda tem fragmentos de Cerrado e mata ciliar. A cada pasto aberto, o corredor por onde a fauna passa fica mais estreito.',
 q:'O que fazer com a vegetação nativa que resta?',
 opts:[
 {t:'Pagar produtores que preservam nascentes e matas (pagamento por serviços ambientais).',r:'Raimundo pondera: manter a mata também dá renda. Helena se emociona ao ver as primeiras nascentes cercadas.',d:[1,0,1],sci:'A expansão agrícola é apontada como um dos principais motores de desmatamento e perda de biodiversidade. Pagamentos por serviços ambientais buscam alinhar conservação e renda, mas dependem de fiscalização e financiamento estáveis.'},
 {t:'Deixar por conta de cada proprietário.',r:'Alguns preservam, outros não. Os corredores ficam quebrados.',d:[-1,1,0],sci:'Sem coordenação, a conservação fica fragmentada, e a perda de conectividade entre áreas naturais prejudica espécies e serviços como a regulação da água e do clima local.'},
 {t:'Desapropriar as áreas de mata e criar uma reserva sem consulta.',r:'A reserva nasce no papel, mas a comunidade se sente invadida e os conflitos explodem.',d:[1,-1,-2],sci:'A conservação feita sem diálogo costuma gerar conflitos e perda de legitimidade. O campo da justiça ambiental destaca a importância de incluir as populações locais nas decisões.'}
 ]},
{who:'marina',ic:'🌡️',say:'Em uma audiência pública, alguém diz que o clima sempre mudou e que o aquecimento de hoje é só mais um ciclo natural. A sala está dividida.',
 q:'Como você responde?',
 opts:[
 {t:'Explicar que o clima já mudou naturalmente antes, mas que o ritmo atual é incomum e atribuído à ação humana.',r:'Marina mostra os gráficos e a sala fica em silêncio. A conversa melhora, e ninguém se sente ridicularizado.',d:[1,0,1],sci:'Segundo o IPCC (AR6), a influência humana aqueceu o planeta num ritmo sem precedentes em pelo menos 2.000 anos, e a temperatura média da última década ficou cerca de 1,1 °C acima da do período 1850–1900.'},
 {t:'Concordar para evitar confronto: não vale a pena polemizar.',r:'A audiência termina em paz, mas a dúvida fica e cresce nas redes sociais.',d:[-1,0,-1],sci:'Deixar afirmações sem resposta pode normalizar a desinformação. A sociologia da comunicação estuda como narrativas se espalham quando não são contestadas.'},
 {t:'Ridicularizar quem duvida e encerrar o debate.',r:'Parte da plateia aplaude, parte sai ofendida. A desconfiança aumenta.',d:[0,0,-2],sci:'Desprezar quem duvida tende a aprofundar a polarização. Dialogar com dúvidas reais, sem concordar com falsidades, costuma ser mais eficaz para construir confiança.'}
 ]},
{who:'marina',ic:'💨',say:'O CO₂ fica séculos na atmosfera, e o metano some em cerca de uma década, mas aquece muito mais enquanto está lá. Onde o município deve focar primeiro?',
 q:'Qual estratégia de gases você adota?',
 opts:[
 {t:'Atacar os dois: metano para frear o aquecimento no curto prazo e CO₂ para estabilizar o clima no longo prazo.',r:'Marina sorri: “Os dois ritmos importam.” O plano é mais trabalhoso, mas mais completo.',d:[2,-1,0],sci:'O metano tem potencial de aquecimento cerca de 28 vezes o do CO₂ em 100 anos, mas dura cerca de 12 anos, enquanto o CO₂ persiste por séculos. O IPCC afirma que é preciso chegar a zero líquido de CO₂ e também reduzir fortemente o metano, que respondeu por cerca de 0,5 °C do aquecimento observado.'},
 {t:'Focar só no CO₂, porque o metano é passageiro.',r:'O plano fica simples, e a pecuária respira aliviada. Marina alerta que o ganho rápido de frear o metano foi deixado de lado.',d:[-1,1,0],sci:'O CO₂ é decisivo no longo prazo porque se acumula, mas ignorar o metano abre mão de uma alavanca de efeito rápido. Há debate sobre como medi-lo: métricas como o GWP* dão valores diferentes dos do GWP de 100 anos, o que importa muito para a pecuária.'},
 {t:'Não priorizar nada até existir uma métrica única aceita por todos.',r:'A discussão técnica se arrasta por meses, e nada sai do papel.',d:[-1,0,0],sci:'O debate sobre métricas é real, mas o IPCC converge na necessidade de cortes fortes de metano. Esperar uma métrica perfeita pode atrasar ações que já se sabe serem úteis.'}
 ]},
{who:'cida',ic:'☀️',say:'Semana passada teve dias de calor demais. Gente passou mal na roça, e o gado também sofreu.',
 q:'Como o Vale responde às ondas de calor?',
 opts:[
 {t:'Criar um plano de adaptação: horários de trabalho mais amenos, sombra, água e abrigo para o gado.',r:'O custo é pequeno perto do ganho. Dona Cida relata que, no verão seguinte, ninguém foi parar no posto de saúde.',d:[0,-1,2],sci:'A 2 °C de aquecimento global, extremos de calor atingiriam com mais frequência limites críticos para a agricultura e a saúde (IPCC). Adaptar protege as pessoas agora, mesmo antes de as emissões caírem.'},
 {t:'Esperar passar: sempre fez calor no interior.',r:'A onda de calor volta mais forte. Os trabalhadores mais pobres são os que mais sofrem.',d:[-1,0,-2],sci:'O aquecimento sobre a terra é maior que a média global, cerca de 1,6 °C contra cerca de 0,9 °C nos oceanos, então o que se sente localmente pode ser pior do que o número médio sugere.'},
 {t:'Responder só com irrigação e ar-condicionado, para quem pode pagar.',r:'As fazendas grandes se refrescam. O assentamento continua no sol.',d:[-1,1,-1],sci:'Soluções privadas aumentam o consumo de água e energia e deixam de fora quem tem menos renda. A literatura sobre justiça climática mostra que os impactos do aquecimento recaem de forma desigual.'}
 ]},
{who:'helena',ic:'⏳',say:'Mesmo que cortássemos as emissões hoje, o clima levaria décadas para estabilizar. E algumas mudanças, como o nível do mar, não voltam mais.',
 q:'Como você planeja o futuro do Vale?',
 opts:[
 {t:'Criar um plano de longo prazo, com metas e um conselho que inclua jovens.',r:'Lia, então uma estudante, ocupa uma cadeira no conselho. Os adultos descobrem que o futuro tem opinião.',d:[1,-1,1],sci:'O IPCC indica que, com reduções fortes e sustentadas, a temperatura levaria 20 a 30 anos para se estabilizar, e que mudanças como a elevação do nível do mar seriam irreversíveis por séculos ou milênios. Decisões de hoje afetam gerações que ainda não votam.'},
 {t:'Priorizar obras visíveis de curto prazo, que rendem votos.',r:'As inaugurações lotam, e as urgentes ficam para depois.',d:[-1,1,0],sci:'A política tende a premiar resultados rápidos, enquanto os custos do aquecimento se distribuem no tempo e entre gerações. Esse descompasso é um dilema clássico da ação coletiva.'},
 {t:'Deixar o problema para as próximas gestões.',r:'O assunto é empurrado, e quem herda a pasta herda também a conta.',d:[-2,1,-1],sci:'Adiar não elimina o custo: como o CO₂ se acumula e parte dos efeitos é irreversível, cada ano de atraso reduz as opções de quem vem depois.'}
 ]},
{who:'vereador',ic:'📋',say:'Mais de cem países prometeram cortar 30% do metano até 2030. E o nosso município, vai fazer o quê?',
 q:'Que tipo de meta você assume?',
 opts:[
 {t:'Fixar uma meta local mensurável, com inventário anual e relatório público.',r:'O vereador reclama do trabalho, mas admite que agora dá para cobrar resultado.',d:[2,-1,1],sci:'Em 2021, mais de 100 países se comprometeram a reduzir em 30% o metano até 2030. O IPCC projeta que, na média dos próximos 20 anos, o planeta atinja ou ultrapasse 1,5 °C. Metas só funcionam com medição e transparência.'},
 {t:'Anunciar uma meta bonita, sem monitoramento nem prazo.',r:'A foto sai ótima nos jornais. Na prática, nada muda.',d:[0,1,-1],sci:'Metas vagas, usadas como propaganda sem mudança real, são chamadas de greenwashing e corroem a confiança pública.'},
 {t:'Esperar o governo federal definir tudo.',r:'O município vira espectador. Quando as regras chegam, o Vale está despreparado.',d:[-1,0,0],sci:'Prefeituras influenciam o uso do solo, os resíduos e o transporte, então esperar apenas o nível federal desperdiça uma escala importante de ação. A ação climática costuma ser multinível.'}
 ]},
{who:'voce',ic:'🌎',say:'Um grande comprador internacional exige garantia de que a carne do Vale não vem de áreas desmatadas. O contrato é grande, e o prazo, curto.',
 q:'Qual a sua decisão final?',
 opts:[
 {t:'Adotar rastreabilidade completa do rebanho, com apoio aos pequenos.',r:'O sistema dá trabalho, mas o selo abre mercados e dá segurança jurídica a quem produz certo.',d:[1,-1,1],sci:'Rastreabilidade ajuda a separar quem produz sem desmatar de quem desmata, mas só funciona se pequenos produtores tiverem condição de participar.'},
 {t:'Aceitar um acordo parcial, rastreando só os grandes fornecedores.',r:'O contrato sai rápido. Os pequenos ficam em uma zona cinzenta que alguém ainda vai cobrar.',d:[0,1,0],sci:'Rastreio parcial deixa brechas: animais podem ser movidos entre fazendas para esconder a origem, o que enfraquece o controle do desmatamento.'},
 {t:'Recusar as exigências e buscar outros compradores menos rigorosos.',r:'O dinheiro entra no curto prazo. Mas a região fica exposta a boicotes e à pressão por novos desmatamentos.',d:[-2,2,-1],sci:'Mercados que exigem origem livre de desmatamento estão crescendo. Escolher compradores menos exigentes tende a aumentar riscos econômicos e ambientais no longo prazo.'}
 ]}
];

let timerOn=false,tm=null,t0=null,ck=null;
function tick(){const e=Math.floor((Date.now()-t0)/1000);document.getElementById('clock').textContent='⏱️ Tempo de jogo: '+Math.floor(e/60)+':'+String(e%60).padStart(2,'0')}
function startClock(){t0=Date.now();clearInterval(ck);ck=setInterval(tick,1000);tick()}
function stopClock(){clearInterval(ck)}
let soundOn=true,AC=null;
function beep(f,d,type,v,delay){if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;const t=AC.currentTime+(delay||0);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}

function stats(){
 const L=[['Clima','clima'],['Economia','eco'],['Comunidade','com']];
 sky();document.getElementById('stats').innerHTML=L.map(([n,k])=>`<div>${n}: ${S[k]}/10<div class="bar"><div class="fill" style="width:${S[k]*10}%"></div></div></div>`).join('');
}
function scene(){
 const sc=scenes[S.i],g=document.getElementById('game');
 g.innerHTML=`<div class="card"><div style="font-size:2.2rem">${scenes[S.i].ic||ICO2[S.i]}</div><span class="tag">Cena ${S.i+1} de ${scenes.length}</span><div class="who">${N[sc.who]}</div><p class="says">“${sc.say}”</p><p class="q">${sc.q}</p><div id="opts">${sc.opts.map((o,j)=>`<button data-j="${j}">${o.t}</button>`).join('')}</div><div id="fb"></div></div>`;
 g.querySelectorAll('#opts button').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
 clearInterval(tm);
 if(timerOn){const t=document.createElement('div');t.innerHTML='<div class="cd" id="cd"></div><div class="timer"><div id="tb"></div></div>';g.querySelector('.card').prepend(t);let s=120;const up=()=>{document.getElementById('tb').style.width=(s/120*100)+'%';const cd=document.getElementById('cd'),bar=document.getElementById('tb');cd.textContent='Tempo para decidir: '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');const low=s<=60;cd.classList.toggle('low',low);bar.classList.toggle('low',low);if(s<=10&&s>0)SFX.warn()};up();tm=setInterval(()=>{s-=1;up();if(s<=0)pick(-1)},1000)}
}
function pick(j){
 clearInterval(tm);const sc=scenes[S.i],o=j<0?OM:sc.opts[j];const dn=o.d[0]+o.d[1]+o.d[2];if(j<0)SFX.alarm();else if(dn>0)SFX.good();else if(dn<0)SFX.bad();else SFX.click();
 S.clima=clamp(S.clima+o.d[0]);S.eco=clamp(S.eco+o.d[1]);S.com=clamp(S.com+o.d[2]);
 S.log.push(o.t);stats();
 document.querySelectorAll('#opts button').forEach((b,k)=>{b.disabled=true;if(k===j)b.classList.add('sel')});
 const last=S.i===scenes.length-1;
 document.getElementById('fb').innerHTML=`<p class="says"><em>${o.r}</em></p><div class="note"><strong>Base científica:</strong> ${o.sci}</div><button class="go" id="nx">${last?'Ver o final':'Continuar'}</button>`;
 document.getElementById('nx').onclick=()=>{S.i++;last?end():scene();window.scrollTo(0,0)};
}
function end(){stopClock();SFX.end();
 const e=ends.find(x=>x.c(S));
 document.getElementById('game').innerHTML=`<div class="card"><span class="tag">Final</span> <span class="tag">⏱️ ${document.getElementById('clock').textContent.replace(/^.*: /,'')}</span><h2 style="margin:4px 0 8px">${e.t}</h2><p class="says">${e.x}</p><div class="letter">${LET[e.t]}</div><div class="note"><strong>No mundo real não existe botão de reiniciar.</strong> Segundo a FAO, boas práticas poderiam reduzir as emissões da pecuária em cerca de um terço, e isso depende de decisões de governos, produtores, empresas e consumidores. Entre elas, recuperar pastos degradados, rastrear a origem da carne e apoiar pequenos produtores.</div><div class="quote">“Cada escolha sobre o que se produz e se consome é também uma escolha sobre clima, terra e gente.”</div><div class="note"><strong>Para discutir:</strong> quais interesses sociais pesaram em cada decisão? Houve alguma escolha que agradasse a todos? E o que mudaria no seu próprio consumo ou na sua profissão?</div><p class="q">Seu caminho</p><ol class="log">${S.log.map(l=>`<li>${l}</li>`).join('')}</ol><button class="go" id="rs">Jogar de novo</button></div>
 <div class="card ref"><strong>Referências</strong><ol class="refl"><li>FEEDIPEDIA. <b>Livestock and greenhouse gas emissions</b>. Animal feed resources information system. Disponível em: https://feedipedia.org/content/livestock-and-greenhouse-gas-emissions. Acesso em: 20 out. 2026.</li><li>GERBER, P. J. et al. <b>Tackling climate change through livestock</b>: a global assessment of emissions and mitigation opportunities. Rome: FAO, 2013. (Fonte primária dos dados da FAO, consultados por meio de resumos.)</li><li>GRIST. <b>Cow farts still stink up the climate, but relief is possible</b>. Disponível em: https://grist.org/news/cow-farts-still-stink-up-the-climate-but-relief-is-possible/. Acesso em: 20 out. 2026.</li><li>HONG KONG OBSERVATORY. <b>Methane – the second culprit in global warming</b>. Disponível em: https://www.hko.gov.hk/en/education/climate/general-climatology/00670-Methane-the-second-culprit-in-global-warming.html. Acesso em: 20 out. 2026.</li><li>IPCC. <b>Climate Change 2021: the physical science basis</b>. Contribution of Working Group I to the Sixth Assessment Report. Cambridge: Cambridge University Press, 2021. Disponível em: https://www.ipcc.ch/report/ar6/wg1/.</li><li>NASA EARTH OBSERVATORY. <b>Satellites find greener pastures</b>. Disponível em: https://www.earthobservatory.nasa.gov/images/144654/satellites-find-greener-pastures. Acesso em: 20 out. 2026.</li><li>OUR WORLD IN DATA. <b>Global land for agriculture</b>. Disponível em: https://ourworldindata.org/global-land-for-agriculture. Acesso em: 20 out. 2026.</li><li>OUR WORLD IN DATA. <b>If the world adopted a plant-based diet, we would reduce global agricultural land use from 4 to 1 billion hectares</b>. Disponível em: https://ourworldindata.org/land-use-diets. Acesso em: 20 out. 2026.</li><li>POORE, J.; NEMECEK, T. Reducing food’s environmental impacts through producers and consumers. <b>Science</b>, v. 360, n. 6392, p. 987-992, 2018.</li><li>THE GUARDIAN. <b>Ex-officials at UN farming body say work on methane emissions was censored</b>. 20 out. 2023. Disponível em: https://www.theguardian.com/environment/2023/oct/20/ex-officials-at-un-farming-fao-say-work-on-methane-emissions-was-censored. Acesso em: 20 out. 2026.</li><li>ZU ERMGASSEN, E. K. H. J. <b>Strategies for sustainable livestock production in Brazil and the European Union</b>. 2018. Tese. Disponível em: https://agris.fao.org/search/ru/records/676586cfc0e94e3bc291a44d. Acesso em: 20 out. 2026.</li></ol>Nota: parte dos dados foi consultada por meio de resumos e sínteses, e não dos textos completos. Os personagens e o município são fictícios, e os efeitos de cada escolha são simplificações didáticas.<br><br>Discentes: Ismael Ramos Corrêa e Willian Santos – UNESP. Docente: Flaviana Cavalcanti da Silva.</div>`;
